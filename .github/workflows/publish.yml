# Builds the image of one app version from its directory, <app>/<version>/, pushes it to the ref its template names,
# and attests the build: a signed statement that this image was built by this workflow from a commit of this
# repository. Anyone can check that before pulling it:
#
#   gh attestation verify oci://ghcr.io/kopernik-us/<app>@<digest> --repo kopernik-us/apps
#
# Images are built from main alone, so every attested image is one built from the history published here.
name: Publish an app version

on:
  workflow_dispatch:
    inputs:
      app:
        description: App, the name of its directory
        required: true
        type: string
      version:
        description: Version, as its template names it; the latest the template lists when left empty
        required: false
        type: string
      replace:
        description: Rebuild a version already published; a digest pinned before stays pullable, untagged
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version from its template
        id: version
        env:
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
        run: python3 -I .github/resolve-version.py "$APP" "$VERSION" | tee -a "$GITHUB_OUTPUT"

      # A Dockerfile which runs nothing builds for every platform without it; one with a RUN step needs it for
      # the platforms other than the runner's own.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to replace a published version unless asked
        if: ${{ !inputs.replace }}
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::$IMAGE is published already; run again with replace to rebuild it"
            exit 1
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.version.outputs.context }}
          platforms: ${{ steps.version.outputs.platforms }}
          push: true
          tags: ${{ steps.version.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Attest the build
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.version.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summarize
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "Published \`$IMAGE\`"
            echo
            echo "Digest \`$DIGEST\`, built from \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
